<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willian NCA - DevOps Pipeline</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="https://thecloudbootcamp.com/wp-content/uploads/2024/07/Logo_TCB.svg" width="180" alt="The Cloud Bootcamp Logo">
        <h1>🚀 Willian NCA - DevOps Journey</h1>
        <h2>Pipeline CI/CD com Jenkins | Docker | GitHub</h2>
    </header>

    <section>
        <h3>📊 Status do Pipeline</h3>
        <div id="status-card" class="card">
            Carregando...
        </div>
        <button onclick="simulateBuild()">🔄 Simular Build</button>
    </section>

    <section>
        <h3>📈 Estatísticas do Pipeline</h3>
        <div id="stats-card" class="card">
            Carregando...
        </div>
    </section>

    <footer>
        <p>© 2025 Willian NCA - The Cloud Bootcamp</p>
        <p>🔗 LinkedIn: williannca | 📧 williannca@devops.com</p>
    </footer>

    <script>
        function simulateBuild() {
            alert('Build simulado! O Jenkins executaria um novo pipeline.');
            location.reload();
        }

        // Buscar as informações do build-info.json
        fetch('/build-info.json')
            .then(response => response.json())
            .then(data => {
                // Atualizar Status do Pipeline
                document.getElementById('status-card').innerHTML = `
                    ✅ Build #${data.buildNumber} - Sucesso!
                    <br>
                    <small>Deploy: ${data.deployDate}</small>
                `;
                
                // Atualizar Estatísticas
                document.getElementById('stats-card').innerHTML = `
                    <p>✅ Total de Builds: <strong>${data.buildNumber}</strong></p>
                    <p>✅ Imagem Docker: <strong>webapp:${data.buildNumber}</strong></p>
                    <p>✅ Último Deploy: <strong>${data.deployDate}</strong></p>
                    <p>✅ Status: <strong style="color:#0bed69">${data.status}</strong></p>
                `;
            })
            .catch(error => {
                console.error('Erro ao carregar build-info:', error);
                document.getElementById('status-card').innerHTML = '⚠️ Build info não disponível';
                document.getElementById('stats-card').innerHTML = '⚠️ Execute o pipeline no Jenkins';
            });
    </script>
</body>
</html>
